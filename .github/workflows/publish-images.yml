name: Publish images

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR (requires packages:write)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image prefix
        id: meta
        run: echo "prefix=ghcr.io/${{ github.repository_owner }}/crm" >> "$GITHUB_OUTPUT"
      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-api:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}-api:latest
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-web:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: apps/worker
          file: apps/worker/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-worker:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}-worker:latest
