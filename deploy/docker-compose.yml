name: crm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public&sslmode=disable
      SUPABASE_JWT_SECRET: compose-local-jwt-secret-not-for-production
      WEB_URL: http://localhost:3000
      ALLOW_INSECURE_WEB_URL: "true"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public&sslmode=disable
      API_PORT: "4000"
      WEB_URL: http://localhost:3000
      ALLOW_INSECURE_WEB_URL: "true"
      SUPABASE_JWT_SECRET: compose-local-jwt-secret-not-for-production
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [stack]
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?sslmode=disable
      WORKER_HEALTH_PORT: "8081"
      WORKER_CONCURRENCY: "10"
      JOB_BATCH_SIZE: "20"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [stack]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  crm_pg:
