apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: crm
data:
  NODE_ENV: production
  API_PORT: "4000"
  WORKER_HEALTH_PORT: "8081"
  WORKER_CONCURRENCY: "10"
  JOB_BATCH_SIZE: "20"
  JOB_POLL_INTERVAL: "2s"
  JOB_LOCK_TIMEOUT: "5m"
  SHUTDOWN_TIMEOUT: "25s"
  INVITATION_TTL_DAYS: "7"
  TASK_REMINDER_HOURS: "24"
  # Replace with the public web origin. CORS uses this exact value.
  WEB_URL: https://app.example.com
