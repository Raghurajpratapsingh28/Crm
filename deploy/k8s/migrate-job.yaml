apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate
  namespace: crm
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: crm-api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          workingDir: /app
          envFrom:
            - secretRef:
                name: crm-secrets
