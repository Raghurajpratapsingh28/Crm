apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: crm
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: crm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: crm-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: API_PORT
              value: "4000"
            - name: WEB_URL
              value: https://app.example.com
          envFrom:
            - secretRef:
                name: crm-secrets
            - secretRef:
                name: crm-billing-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 20
