# Replace values before apply. Prefer an external secret manager in production.
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public
  SUPABASE_JWT_SECRET: replace-me
  NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: replace-me
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
