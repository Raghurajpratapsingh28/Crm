# Placeholder values only. Do not apply this file to production as-is.
# Create the secrets from a sealed-secret / external-secrets / kubectl create secret.
# Web must never receive Stripe/Razorpay/Supabase service-role secrets.
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  DATABASE_URL: postgresql://crm:replace-me@postgres:5432/crm?schema=public
  POSTGRES_USER: crm
  POSTGRES_PASSWORD: replace-me
  POSTGRES_DB: crm
  SUPABASE_JWT_SECRET: replace-me
  SUPABASE_URL: https://your-project.supabase.co
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_FROM: ""
  SMTP_USER: ""
  SMTP_PASS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-web-secrets
  namespace: crm
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-billing-secrets
  namespace: crm
type: Opaque
stringData:
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PUBLISHABLE_KEY: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
