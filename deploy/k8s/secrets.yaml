# Replace values before apply. Prefer an external secret manager in production.
# Web must not receive Stripe/Razorpay secrets.
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  DATABASE_URL: postgresql://crm:crm@postgres:5432/crm?schema=public
  SUPABASE_JWT_SECRET: replace-me
  SUPABASE_URL: https://your-project.supabase.co
  WEB_URL: https://app.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-web-secrets
  namespace: crm
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: https://your-project.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: replace-me
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
  NEXT_PUBLIC_RAZORPAY_KEY_ID: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: crm-billing-secrets
  namespace: crm
type: Opaque
stringData:
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PUBLISHABLE_KEY: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
